name: Patch script 74 scope bug

on:
  push:
    paths:
      - .github/workflows/patch-script74.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/74_m3_lolh_diagnostics.jl')
          s = p.read_text(encoding='utf-8')
          assert s.count('any_m3_dispute = false') == 1
          assert s.count('    any_m3_dispute = true') == 1
          assert s.count('if any_m3_dispute') == 2
          s = s.replace('any_m3_dispute = false', 'any_m3_dispute = Ref(false)', 1)
          s = s.replace('    any_m3_dispute = true', '    any_m3_dispute[] = true', 1)
          s = s.replace('if any_m3_dispute', 'if any_m3_dispute[]')
          p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/patch-script74.yml .github/workflows/oneoff-final-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/74_m3_lolh_diagnostics.jl .github/workflows
          git commit -m "fix: correct script 74 M3 dispute flag scope"
          git push
