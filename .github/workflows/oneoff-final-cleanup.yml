Five timed repetitions are used for the non-M3 storage methods, and three for M3. Scenario generation and data loading are outside the timed block. The manuscript Table IV now reports M3 runtimes of 9.12 and 8.92 s/scenario, consistent with this benchmark.

---

## 6. M2 solver sensitivity

A controlled N=20 comparison of HiGHS 1.23.0 and Gurobi 13.0.2 found:

| Metric | Maximum difference | Conclusion |
|---|---:|---|
| EUE components | ≤ 9.09 × 10⁻¹³ MWh | invariant |
| Marginal CC | ≤ 3.43 × 10⁻¹⁴ | invariant |
| LP objective | ≤ 1.82 × 10⁻¹² | invariant |
| Event-window boundaries | identical | invariant |
| LOLH | 5.75 vs 7.20 balanced; 1.95 vs 2.25 wind-heavy | alternative-optimum sensitivity |

The disputed M2 hours contain 1.64–935 MW of load shedding, so the difference is not solver feasibility noise. Both solvers attain the same EUE while assigning the shortfall to different hours inside the same event windows.

Manuscript-facing M2 values consistently use Gurobi. The Gurobi event-shape values are:

| Portfolio | Events/yr | Mean duration | Maximum duration | Maximum shortfall |
|---|---:|---:|---:|---:|
| Balanced VRE | 2.9 | 2.5 h | 8 h | 1,440 MW |
| Wind-heavy | 1.0 | 2.4 h | 7 h | 1,335 MW |

---

## 7. M3 solver sensitivity

Script 74 confirms Case B for full-year ED as well:

| Portfolio | Gurobi LOLH | HiGHS LOLH | EUE difference | Disputed hours | Disputed magnitude |
|---|---:|---:|---:|---:|---:|
| Balanced VRE | 5.95 | 5.70 | ≤ 9 × 10⁻¹³ MWh | 93 | 14–968 MW |
| Wind-heavy | 2.25 | 1.95 | 0 | 20 | 21–971 MW |

All scenarios terminated optimally. The current Table IV values, 6.0 and 2.3 h/yr after rounding, already correspond to Gurobi and require no numerical adjustment. EUE is unchanged.

The historical execution log ends with an incorrect solver-independent summary because of the soft-scope flag bug described above; the portfolio-level diagnostic immediately preceding it and `m3_lolh_comparison.csv` are authoritative. The corrected script will print the Case B summary and write optional detailed diagnostics on a future run.

---

## 8. Final manuscript and figure convention

- Gurobi is the production solver for all LP-based manuscript metrics.
- HiGHS values are disclosed only as solver-sensitivity results.
- EUE and EUE-based CC remain the primary solver-invariant quantities.
- LP-derived LOLH and event-shape values correspond to the Gurobi-selected optimum and are not claimed to be unique.
- Both market-pattern variants use the energy-balanced calibration, cyclic SOC near 23.1%, and charge curtailment to available pre-storage surplus.
- Runtime figures and Table IV use `runtime_common_benchmark.csv` for all methods available in that benchmark.
- Figure provenance now points MP event-shape rows to the actual source commit rather than a paper-submodule pointer commit.

No unresolved validation item remains for team review.
''', encoding='utf-8')
