name: One-off final repository cleanup

on:
  push:
    paths:
      - .github/workflows/oneoff-final-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct script 74, validation documentation, manifest, and paper pointer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Fix Julia top-level soft-scope bug without changing model logic.
          script = Path('scripts/74_m3_lolh_diagnostics.jl')
          text = script.read_text(encoding='utf-8')
          checks = {
              'any_m3_dispute = false': 1,
              '    any_m3_dispute = true': 1,
              'if any_m3_dispute': 2,
          }
          for needle, expected in checks.items():
              actual = text.count(needle)
              if actual != expected:
                  raise SystemExit(f'{script}: expected {expected} occurrences of {needle!r}, found {actual}')
          text = text.replace('any_m3_dispute = false', 'any_m3_dispute = Ref(false)', 1)
          text = text.replace('    any_m3_dispute = true', '    any_m3_dispute[] = true', 1)
          text = text.replace('if any_m3_dispute', 'if any_m3_dispute[]')
          script.write_text(text, encoding='utf-8')

          # Correct the script-74 result commit recorded in the run manifest.
          manifest = Path('results/paper_tables/market_pattern_run_manifest.csv')
          mtext = manifest.read_text(encoding='utf-8')
          old = ',09ade78,09ade78,b0f9aa4,false,'
          new = ',09ade78,09ade78,a8564a8,false,'
          if mtext.count(old) != 1:
              raise SystemExit(f'Expected one script-74 manifest provenance string, found {mtext.count(old)}')
          manifest.write_text(mtext.replace(old, new, 1), encoding='utf-8')

          # Replace the internally contradictory validation note with one final audit record.
          doc = Path('docs/market_pattern_cc_runtime_validation.md')
          doc.write_text(r'''# Market-Pattern Capacity Credit and Runtime Validation

**Updated:** 2026-06-17  
**Authoritative script-74 result commit:** `a8564a8`  
**Current manuscript commit:** `c8b4f98`  
**Primary scripts:** `scripts/70_market_pattern_marginal_cc.jl`, `scripts/71_common_runtime_benchmark.jl`, `scripts/72_m2_solver_regression.jl`, `scripts/73_m2_lolh_diagnostics.jl`, `scripts/74_m3_lolh_diagnostics.jl`

## Validation decision

> **READY FOR TEAM REVIEW**

The energy-balanced market-pattern reliability, marginal-capacity-credit, bootstrap, and common-runtime experiments are complete. M2 and M3 solver sensitivity has also been diagnosed. Gurobi is the production solver for manuscript-facing LP results. No additional Monte Carlo or capacity-credit rerun is required.

The central conclusion is metric-specific:

- EUE and EUE-based capacity credit are invariant across the tested HiGHS and Gurobi alternative optima to numerical precision.
- LOLH and event-shape statistics can differ because an EUE-minimizing LP does not uniquely determine the temporal allocation of load shedding.
- The manuscript reports the Gurobi-selected production solution and discloses the HiGHS sensitivities.

---

## 1. Experiment protocol

The normalized marginal capacity credit is

```text
CC(δ) = [EUE(x) - EUE(x + ΔS)] / [EUE(x) - EUE(x + ΔF)]
```

where `x + ΔS` adds δ MW of four-hour storage and `x + ΔF` adds δ MW of perfect-firm capacity. All three cases use common random numbers, and the perfect-firm denominator is obtained from an explicit model rerun.

| Parameter | Value |
|---|---|
| Portfolios | `VRE120_base`, `VRE120_wind_hvy` |
| Scenario seed | 42 |
| Nested sample sizes | 20, 50, 100, 200, 500, 1000 |
| Marginal increments | 1, 5, 10 MW |
| Bootstrap | 2,000 paired draws, seed 1234 |
| Market-pattern calibration | `pattern_energy_balanced` |
| Market-pattern initial SOC | cyclic fixed point, approximately 0.231 |
| M2 parameters | 1000 MW risk margin / 48 h buffer / 24 h merge gap / 24 h minimum window |

The first N members of one N=1000 scenario set are used at each smaller N. Nested estimates need not move monotonically as N increases.

A CC denominator is classified as `identified` when its paired-bootstrap interval remains positive and at least 90% of bootstrap CC draws are finite. All manuscript-facing N=20, δ=1 MW rows are identified.

---

## 2. Provenance map

