| `results/paper_tables/diag_74_log.txt` | Script-74 execution log and disputed-hour summary | Complete; historical final line was affected by the corrected Julia soft-scope bug |

The historical script-74 run did not write the optional detailed M3 disputed-hour and threshold CSVs because a top-level Julia soft-scope flag remained false after the loop. The script has now been corrected using `Ref(false)` and `[]` mutation. The committed comparison rows and console diagnostic already establish the manuscript result, so rerunning the approximately multi-hour HiGHS experiment is not required for the paper. A future rerun will write the optional detailed CSVs correctly.

---

## 4. N=20 market-pattern reliability and capacity credit

| Portfolio | Method | LOLH (h/yr) | EUE (MWh) | CC | 95% bootstrap CI |
|---|---|---:|---:|---:|---:|
| Balanced VRE | Market-pattern | 46.0 | 13,655.1 | 0.1438 | [0.1306, 0.1569] |
| Balanced VRE | Market-pattern + emergency | 7.7 | 3,596.0 | 0.3583 | [0.3291, 0.3894] |
| Balanced VRE | Emergency-only | 5.95 | 2,479.2 | 0.4974 | [0.4822, 0.5183] |
| Wind-heavy | Market-pattern | 23.9 | 7,160.6 | 0.1280 | [0.1144, 0.1409] |
| Wind-heavy | Market-pattern + emergency | 2.4 | 836.2 | 0.4935 | [0.4412, 0.5760] |
| Wind-heavy | Emergency-only | 2.25 | 648.2 | 0.6041 | [0.5486, 0.6545] |

The main comparison retains N=20, δ=1 MW values because the reliability table itself uses N=20. Larger-N estimates are convergence evidence, not silent replacements for the main-table values.

Pure market-pattern CC is comparatively stable across N and δ. The emergency-override estimate is more sample- and increment-sensitive, particularly for wind-heavy VRE, and should not be described as fully converged from N=20 alone.

---

