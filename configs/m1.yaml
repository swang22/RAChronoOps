# M1: rule-based storage dispatch
# n_scenarios and seed are set in base_case.yaml and must not be overridden
# here — scenario generation is shared across models for fair comparison.

voll: 10000.0

# Rule thresholds
high_net_load_quantile: 0.75
charge_net_load_quantile: 0.25

# Risk metric
cvar_alpha: 0.95

# Output
save_dispatch: true
output_dir: results/m1
