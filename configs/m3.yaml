# M3: full-year economic dispatch LP (per scenario)
# n_scenarios and seed are set in base_case.yaml and must not be overridden
# here — scenario generation is shared across models for fair comparison.

voll: 10000.0

# Full-year ED options
cyclic_soc: true
storage_cycling_cost: 0.01

# Risk metric
cvar_alpha: 0.95

# Output
save_dispatch: false
output_dir: results/m3
