# M2: rolling-window LP (MPC)
# n_scenarios and seed are set in base_case.yaml and must not be overridden
# here — scenario generation is shared across models for fair comparison.

voll: 10000.0

# Rolling window
lookahead_hours: 168        # 1-week look-ahead
epsilon_cycling: 0.001

# Risk metric
cvar_alpha: 0.95

# Output — disable dispatch CSV by default (large file)
save_dispatch: false
output_dir: results/m2
